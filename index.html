<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zara AI - Bangla Character Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#ececec;font-family:'Inter','Hind Siliguri',sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:14px 20px;background:#1a1a1a;border-bottom:1px solid #2a2a2a;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;font-weight:600}
header h1 span{color:#ff4d8d}
.tabs{display:flex;gap:8px}
.tab{padding:8px 14px;border-radius:20px;background:#2a2a2a;border:1px solid #333;cursor:pointer;font-size:13px;transition:.2s}
.tab.active{background:#ff4d8d;color:#fff;border-color:#ff4d8d}
.tab.active.roast{background:#ffaa00;color:#000}
.tab.active.study{background:#00d18f;color:#000}
#chat{flex:1;overflow-y:auto;padding:20px;max-width:800px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.msg{max-width:85%;padding:14px 16px;border-radius:18px;line-height:1.6;font-size:15px;animation:pop .2s}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.user{align-self:flex-end;background:#ff4d8d;color:white;border-bottom-right-radius:6px}
.bot{align-self:flex-start;background:#1e1e1e;border:1px solid #2a2a2a;border-bottom-left-radius:6px}
.bot small{color:#888;display:block;margin-top:6px;font-size:11px}
.input-area{padding:12px;background:#1a1a1a;border-top:1px solid #2a2a2a;display:flex;gap:10px;max-width:800px;width:100%;margin:0 auto}
input{flex:1;background:#2a2a2a;border:1px solid #333;border-radius:24px;padding:12px 18px;color:#fff;outline:none;font-size:15px}
input:focus{border-color:#ff4d8d}
button.send{background:#ff4d8d;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px;color:#fff}
.typing{font-size:13px;color:#888;margin-left:10px}
.welcome{text-align:center;margin-top:40px;color:#666}
.welcome h2{color:#fff;margin-bottom:8px}
</style>
</head>
<body>
<header>
<h1><span>Zara</span> AI</h1>
<div class="tabs">
<div class="tab active" data-char="gf" onclick="switchChar('gf',this)">💖 GF</div>
<div class="tab" data-char="roast" onclick="switchChar('roast',this)">😂 Roast</div>
<div class="tab" data-char="study" onclick="switchChar('study',this)">📚 Study</div>
</div>
</header>

<div id="chat">
<div class="welcome">
<h2 id="welcome-title">হাই জান! 💖</h2>
<p id="welcome-desc">আমি Zara, তোমার রাগী cute GF. যা খুশি বলো...</p>
</div>
</div>

<div class="input-area">
<input id="inp" placeholder="Message Zara..." onkeydown="if(event.key==='Enter')send()">
<button class="send" onclick="send()">➤</button>
</div>

<script>
let character = 'gf';
let API = '/api/chat';

function switchChar(c, el){
 character = c;
 document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active','roast','study'));
 el.classList.add('active');
 if(c!=='gf') el.classList.add(c);
 const titles = {
   gf: ['হাই জান! 💖','আমি Zara, তোমার রাগী cute GF. যা খুশি বলো...','Message Zara...'],
   roast: ['কিরে ভাই! 💀','আমি Roast Master, তোরে roast করমু আজকে। সাহস থাকলে লেখ 😂','Roast me bro...'],
   study: ['পড়াশোনা শুরু করি! 📚','আমি তোমার Study Buddy. Math, English যেটা লাগে জিজ্ঞেস করো।','প্রশ্ন লেখো...']
 }
 document.getElementById('welcome-title').innerText = titles[c][0];
 document.getElementById('welcome-desc').innerText = titles[c][1];
 document.getElementById('inp').placeholder = titles[c][2];
 document.getElementById('chat').innerHTML = `<div class="welcome"><h2 id="welcome-title">${titles[c][0]}</h2><p id="welcome-desc">${titles[c][1]}</p></div>`;
}

async function send(){
 const inp = document.getElementById('inp');
 const text = inp.value.trim();
 if(!text) return;
 const chat = document.getElementById('chat');
 if(chat.querySelector('.welcome')) chat.innerHTML='';
 
 chat.innerHTML += `<div class="msg user">${text}</div>`;
 inp.value='';
 chat.scrollTop = chat.scrollHeight;
 
 const id = Date.now();
 chat.innerHTML += `<div class="msg bot" id="b${id}"><span class="typing">Zara typing...</span></div>`;
 chat.scrollTop = chat.scrollHeight;

 try{
  const res = await fetch(API, {
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body: JSON.stringify({message:text, character:character})
  });
  const data = await res.json();
  document.getElementById('b'+id).innerHTML = `${data.reply}<small>Zara • just now</small>`;
 }catch(e){
  document.getElementById('b'+id).innerHTML = `Server error, API key check করো 😢`;
 }
 chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
  </html>
